<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | E7jezli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root { --admin-sidebar: #1e293b; }
        body { background: #f8fafc; }
        
        .admin-layout { display: flex; min-height: 100vh; }
        
        /* Sidebar Styles */
        .admin-sidebar { 
            width: 260px; background: var(--admin-sidebar); color: white; 
            padding: 2rem 1.5rem; transition: 0.3s; position: sticky; top: 0; height: 100vh;
        }
        .admin-nav { list-style: none; margin-top: 3rem; }
        .admin-nav li { margin-bottom: 0.5rem; }
        .admin-nav a { 
            display: flex; align-items: center; gap: 1rem; padding: 1rem; 
            color: #cbd5e1; border-radius: 12px; transition: 0.3s; text-decoration: none;
        }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; }

        /* Main Content */
        .admin-main { flex: 1; padding: 2rem; overflow-x: hidden; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: var(--shadow-soft); border: 1px solid var(--border); }
        .stat-card i { font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }
        .stat-card h3 { font-size: 0.9rem; color: var(--text-muted); }
        .stat-card p { font-size: 1.8rem; font-weight: 800; margin-top: 0.5rem; }

        /* Responsive Mobile */
        @media (max-width: 992px) {
            .admin-sidebar { 
                position: fixed; right: -100%; z-index: 1000; height: 100vh; 
            }
            .admin-sidebar.active { right: 0; }
            .mobile-admin-header { 
                display: flex !important; justify-content: space-between; align-items: center;
                background: white; padding: 1rem; border-bottom: 1px solid var(--border);
                position: sticky; top: 0; z-index: 999;
            }
            .admin-main { padding: 1rem; }
        }

        .data-card { 
            background: white; border-radius: 20px; padding: 1.5rem; margin-bottom: 1rem;
            border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        @media (max-width: 600px) {
            .data-card { flex-direction: column; text-align: center; gap: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Mobile Header (Only visible on mobile) -->
    <div class="mobile-admin-header" style="display: none;">
        <a href="index.html" class="logo"><img src="img/logo.png" alt="E7jezli" style="height: 40px;"></a>
        <button class="btn btn-outline" id="adminMenuToggle" style="padding: 0.5rem;"><i class="fa-solid fa-bars-staggered"></i></button>
    </div>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <img src="img/logo.png" alt="E7jezli" style="height: 50px; filter: brightness(0) invert(1);">
            </div>
            <ul class="admin-nav">
                <li><a href="#" class="active"><i class="fa-solid fa-chart-line"></i> الإحصائيات</a></li>
                <li><a href="#"><i class="fa-solid fa-calendar-check"></i> الحجوزات</a></li>
                <li><a href="#"><i class="fa-solid fa-users"></i> المستخدمين</a></li>
                <li><a href="index.html" style="margin-top: 5rem; color: #f87171;"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <h1 style="font-size: 1.5rem; font-weight: 800;">لوحة التحكم</h1>
                <span style="color: var(--text-muted); font-size: 0.9rem;">أهلاً بك، المدير</span>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fa-solid fa-calendar-day"></i>
                    <h3>حجوزات اليوم</h3>
                    <p id="todayBookings">12</p>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-coins"></i>
                    <h3>إجمالي الدخل</h3>
                    <p id="totalIncome">2,450 ₪</p>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-user-plus"></i>
                    <h3>شركاء جدد</h3>
                    <p id="newPartners">4</p>
                </div>
            </div>

            <h2 style="margin-bottom: 1.5rem; font-size: 1.2rem;">أحدث الحجوزات</h2>
            <div id="adminBookingList">
                <!-- Dynamic Content -->
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Mobile Toggle Logic
        const toggleBtn = document.getElementById('adminMenuToggle');
        const sidebar = document.getElementById('adminSidebar');
        
        if(toggleBtn) {
            toggleBtn.onclick = () => sidebar.classList.toggle('active');
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth < 992 && !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });

        // Load Admin Data
        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('adminBookingList');
            const bookings = await E7_DB.getBookings();
            
            if(bookings.length === 0) {
                list.innerHTML = '<p style="text-align:center; padding:3rem; color:var(--text-muted);">لا توجد بيانات حالياً</p>';
                return;
            }

            list.innerHTML = bookings.map(b => `
                <div class="data-card">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <div style="background: var(--primary-light); color: var(--primary); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-receipt"></i>
                        </div>
                        <div style="text-align: right;">
                            <strong style="display: block;">${b.businessName}</strong>
                            <small style="color: var(--text-muted);">${b.date} | ${b.service}</small>
                        </div>
                    </div>
                    <div>
                        <span style="font-weight: 700;">${b.price} ₪</span>
                        <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; margin-right: 1rem;">تفاصيل</button>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
