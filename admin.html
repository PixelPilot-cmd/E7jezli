<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | إحجزلي في رام الله</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root { --admin-sidebar: #1e293b; }
        body { background: #f8fafc; }
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar { 
            width: 260px; background: var(--admin-sidebar); color: white; 
            padding: 2rem 1.5rem; transition: 0.3s; position: sticky; top: 0; height: 100vh;
        }
        .admin-nav { list-style: none; margin-top: 3rem; }
        .admin-nav li { margin-bottom: 0.5rem; }
        .admin-nav a { 
            display: flex; align-items: center; gap: 1rem; padding: 1rem; 
            color: #cbd5e1; border-radius: 12px; transition: 0.3s; text-decoration: none; cursor: pointer;
        }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; }
        .admin-main { flex: 1; padding: 2rem; overflow-x: hidden; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: var(--shadow-soft); border: 1px solid var(--border); }
        .stat-card i { font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }
        .stat-card h3 { font-size: 0.9rem; color: var(--text-muted); }
        .stat-card p { font-size: 1.8rem; font-weight: 800; margin-top: 0.5rem; }

        @media (max-width: 992px) {
            .admin-sidebar { position: fixed; right: -100%; z-index: 1000; height: 100vh; }
            .admin-sidebar.active { right: 0; }
            .mobile-admin-header { 
                display: flex !important; justify-content: space-between; align-items: center;
                background: white; padding: 1rem; border-bottom: 1px solid var(--border);
                position: sticky; top: 0; z-index: 999;
            }
            .admin-main { padding: 1rem; }
        }

        .data-card { 
            background: white; border-radius: 20px; padding: 1.2rem; margin-bottom: 1rem;
            border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        /* Login Overlay */
        .admin-login-overlay {
            position: fixed; inset: 0; background: var(--bg-main);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .admin-login-box {
            background: white; padding: 3rem; border-radius: 30px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: var(--shadow-soft); border: 1px solid var(--border);
        }
        .admin-login-box input {
            width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 12px;
            outline: none; margin-bottom: 1.5rem; text-align: center; font-size: 1.1rem;
        }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        /* Toast styles */
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 10000; }
    .toast { background: rgba(0,0,0,0.85); color: #fff; padding: 0.75rem 1rem; margin-top: 0.5rem; border-radius: 8px; animation: fadeIn 0.3s; }
    .toast-success { background: #10b981; }
    .toast-error { background: #ef4444; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

    <!-- Admin Login -->
    <div class="admin-login-overlay" id="adminLogin">
        <div class="admin-login-box">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;"><img src="img/logo.png" alt="E7jezli" style="height: 60px;"></a>
            <h2 style="margin-bottom: 1.5rem; font-size: 1.6rem; font-weight: 800;">تسجيل دخول الإدارة</h2>
            <div style="text-align: right; margin-bottom: 0.5rem;"><label style="font-weight: 600; font-size: 0.9rem;">كلمة السر</label></div>
            <input type="password" id="adminPwd" placeholder="">
            <button class="btn btn-primary" onclick="checkAdminLogin()" style="width: 100%; justify-content: center; padding: 1.2rem;">دخول</button>
            <p id="loginError" style="color: #ef4444; margin-top: 1rem; display: none; font-weight: 600;">كلمة المرور خاطئة!</p>
        </div>
    </div>

    <div class="mobile-admin-header" style="display: none;">
        <a href="index.html" class="logo"><img src="img/logo.png" alt="E7jezli" style="height: 40px;"></a>
        <button class="btn btn-outline" id="adminMenuToggle" style="padding: 0.5rem;"><i class="fa-solid fa-bars-staggered"></i></button>
    </div>

    <div class="admin-layout" style="display: none;" id="adminLayoutContent">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <img src="img/logo.png" alt="E7jezli" style="height: 50px; filter: brightness(0) invert(1);">
            </div>
            <ul class="admin-nav">
                <li><a onclick="showSection('stats', this)" class="nav-item active"><i class="fa-solid fa-chart-line"></i> الإحصائيات</a></li>
                <li><a onclick="showSection('bookings', this)" class="nav-item"><i class="fa-solid fa-calendar-check"></i> الحجوزات</a></li>
                <li><a onclick="showSection('businesses', this)" class="nav-item"><i class="fa-solid fa-building"></i> المؤسسات</a></li>
                <li><a onclick="showSection('add-business', this)" class="nav-item"><i class="fa-solid fa-plus-circle"></i> إضافة مؤسسة</a></li>
                <li><a onclick="adminLogout()" style="margin-top: 5rem; color: #f87171;"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <!-- Stats Section -->
            <div id="statsSection" class="admin-section active">
                <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                    <h1 style="font-size: 1.5rem; font-weight: 800;">إحصائيات المنصة</h1>
                    <a href="index.html" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;">عودة للموقع</a>
                </header>
                <div class="stats-grid">
                    <div class="stat-card"><i class="fa-solid fa-calendar-day"></i><h3>إجمالي الحجوزات</h3><p id="totalCount">0</p></div>
                    <div class="stat-card"><i class="fa-solid fa-clock-rotate-left"></i><h3>حجوزات قيد المراجعة</h3><p id="pendingCount">0</p></div>
                    <div class="stat-card"><i class="fa-solid fa-user-plus"></i><h3>الشركاء</h3><p id="partnerCount">0</p></div>
                </div>
            </div>

            <!-- Bookings Section -->
            <div id="bookingsSection" class="admin-section">
                <header style="margin-bottom: 2rem;"><h1 style="font-size: 1.5rem; font-weight: 800;">إدارة الحجوزات</h1></header>
                <div id="adminBookingList"></div>
            </div>

            <!-- Businesses Section -->
            <div id="businessesSection" class="admin-section">
                <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                    <h1 style="font-size: 1.5rem; font-weight: 800;">إدارة المؤسسات</h1>
                </header>
                <div id="adminBusinessList"></div>
            </div>

            <!-- Add Business Section -->
            <div id="add-businessSection" class="admin-section">
                <header style="margin-bottom: 2rem;">
                    <h1 style="font-size: 1.5rem; font-weight: 800;">إضافة مؤسسة جديدة</h1>
                </header>
                <div style="background: white; padding: 2rem; border-radius: 20px; border: 1px solid var(--border);">
                    <form id="addBusinessForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div style="grid-column: 1 / -1;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">اسم المؤسسة *</label>
                            <input type="text" id="bizName" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">التصنيف *</label>
                            <select id="bizCategory" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                                <option value="">اختر التصنيف</option>
                                <option value="مطاعم">مطاعم</option>
                                <option value="coffe">coffe</option>
                                <option value="صالات افراح">صالات افراح</option>
                                <option value="نوادي رياضية">نوادي رياضية</option>
                                <option value="ملاعب كرة قدم">ملاعب كرة قدم</option>
                                <option value="صالات ترفيهية">صالات ترفيهية</option>
                                <option value="شركات توصيل">شركات توصيل</option>
                                <option value="فنادق">فنادق</option>
                                <option value="عيادات تجميلية">عيادات تجميلية</option>
                                <option value="صالونات نسائية">صالونات نسائية</option>
                                <option value="صالونات رجالية">صالونات رجالية</option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">نوع الخدمة *</label>
                            <select id="bizServiceType" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                                <option value="">اختر نوع الخدمة</option>
                                <option value="wedding_hall">قاعة أفراح</option>
                                <option value="restaurant">مطعم</option>
                                <option value="coffee_shop">كوفي شوب</option>
                                <option value="gym">نادي رياضي</option>
                                <option value="sports_field">ملعب كرة قدم</option>
                                <option value="entertainment_center">صالة ترفيهية</option>
                                <option value="delivery_company">شركة توصيل</option>
                                <option value="hotel">فندق</option>
                                <option value="beauty_clinic">عيادة تجميلية</option>
                                <option value="womens_salon">صالون نسائي</option>
                                <option value="mens_salon">صالون رجالي</option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">السعة (عدد الأشخاص) *</label>
                            <input type="number" id="bizCapacity" required min="1" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">اسم المستخدم للمؤسسة *</label>
                            <input type="text" id="bizUsername" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">كلمة المرور *</label>
                            <input type="password" id="bizPassword" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">رقم الهاتف *</label>
                            <input type="tel" id="bizPhone" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">رابط الصورة</label>
                            <input type="file" id="bizImages" multiple accept="image/*" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">الوصف</label>
                            <textarea id="bizDescription" rows="3" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;"></textarea>
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">رابط فيسبوك (اختياري)</label>
                            <input type="url" id="bizFacebook" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">رابط إنستغرام (اختياري)</label>
                            <input type="url" id="bizInstagram" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">رابط واتساب (اختياري)</label>
                            <input type="url" id="bizWhatsapp" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 10px;">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;">إضافة المؤسسة</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="toast-container" id="toastContainer"></div>
    </div>

    <!-- Edit Business Modal -->
    <div id="editBusinessModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px; text-align: right;">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h3 style="margin-bottom: 1.5rem; text-align: center; color: var(--primary);">تعديل بيانات المؤسسة</h3>
            <form id="editBusinessForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <input type="hidden" id="editBizId">
                <div style="grid-column: 1 / -1;">
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">اسم المؤسسة *</label>
                    <input type="text" id="editBizName" required style="width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 10px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">التصنيف *</label>
                    <select id="editBizCategory" required style="width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 10px;">
                        <option value="مطاعم">مطاعم</option>
                        <option value="coffe">coffe</option>
                        <option value="صالات افراح">صالات افراح</option>
                        <option value="نوادي رياضية">نوادي رياضية</option>
                        <option value="ملاعب كرة قدم">ملاعب كرة قدم</option>
                        <option value="صالات ترفيهية">صالات ترفيهية</option>
                        <option value="شركات توصيل">شركات توصيل</option>
                        <option value="فنادق">فنادق</option>
                        <option value="عيادات تجميلية">عيادات تجميلية</option>
                        <option value="صالونات نسائية">صالونات نسائية</option>
                        <option value="صالونات رجالية">صالونات رجالية</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">السعة (عدد الأشخاص) *</label>
                    <input type="number" id="editBizCapacity" required min="1" style="width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 10px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">اسم المستخدم للمؤسسة *</label>
                    <input type="text" id="editBizUsername" required style="width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 10px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">كلمة المرور الجديدة</label>
                    <input type="password" id="editBizPassword" placeholder="اتركه فارغاً للإبقاء على الحالية" style="width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 10px;">
                </div>
                <div style="grid-column: 1 / -1;">
                    <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">رقم الهاتف *</label>
                    <input type="tel" id="editBizPhone" required style="width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 10px;">
                </div>
                <div style="grid-column: 1 / -1; display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center; padding: 0.8rem;">حفظ التعديلات</button>
                    <button type="button" class="btn btn-outline" onclick="closeEditModal()" style="flex: 1; justify-content: center; padding: 0.8rem; border-color: #cbd5e1; color: #64748b;">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Authentication Logic
        async function checkAdminLogin() {
            const pwd = document.getElementById('adminPwd').value;
            const btn = document.querySelector('#adminLogin button');
            btn.textContent = ' جاري التحقق...';
            const spinner = document.createElement('i');
            spinner.className = 'fa-solid fa-spinner fa-spin';
            btn.prepend(spinner);
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/Auth/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });

                if (res.ok) {
                    const data = await res.json();
                    sessionStorage.setItem('isAdmin', 'true');
                    sessionStorage.setItem('adminToken', data.Token);
                    document.getElementById('adminLogin').style.display = 'none';
                    document.getElementById('adminLayoutContent').style.display = 'flex';
                    loadAdminData();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (err) {
                // Fallback to client-side validation if server is unavailable
                if (pwd === "Ramallah@2026!AdminSecure") {
                    sessionStorage.setItem('isAdmin', 'true');
                    document.getElementById('adminLogin').style.display = 'none';
                    document.getElementById('adminLayoutContent').style.display = 'flex';
                    loadAdminData();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } finally {
                btn.textContent = 'دخول';
                btn.disabled = false;
            }
        }

        function adminLogout() {
            sessionStorage.removeItem('isAdmin');
            window.location.reload();
        }

        window.onload = () => {
            if (sessionStorage.getItem('isAdmin') === 'true') {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminLayoutContent').style.display = 'flex';
                loadAdminData();
            }
        };

        // Navigation Logic
        function showSection(id, element) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            const target = document.getElementById(id + 'Section');
            if(target) target.classList.add('active');
            if(element) element.classList.add('active');
            if(window.innerWidth < 992) document.getElementById('adminSidebar').classList.remove('active');
        }

        const toggleBtn = document.getElementById('adminMenuToggle');
        if(toggleBtn) toggleBtn.onclick = () => document.getElementById('adminSidebar').classList.toggle('active');

        // Toast helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }
        document.getElementById('addBusinessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = ' جاري الإضافة...';
            const spinner = document.createElement('i');
            spinner.className = 'fa-solid fa-spinner fa-spin';
            btn.prepend(spinner);
            btn.disabled = true;

            try {
                const businessData = {
                    name: document.getElementById('bizName').value,
                    category: document.getElementById('bizCategory').value,
                    serviceType: document.getElementById('bizServiceType').value,
                    capacity: parseInt(document.getElementById('bizCapacity').value),
                    username: document.getElementById('bizUsername').value,
                    password: document.getElementById('bizPassword').value,
                    phoneNumber: document.getElementById('bizPhone').value,
                };
                // Upload images if any
                let imageUrls = [];
                const imageFiles = document.getElementById('bizImages').files;
                if (imageFiles.length > 0) {
                    const formData = new FormData();
                    for (let i = 0; i < imageFiles.length; i++) {
                        formData.append('images', imageFiles[i]);
                    }
                    const uploadRes = await fetch(`${API_BASE_URL}/Businesses/uploadImages`, {
                        method: 'POST',
                        body: formData
                    });
                    if (uploadRes.ok) {
                        const data = await uploadRes.json(); // expecting { urls: [...] }
                        imageUrls = data.urls || [];
                    }
                }
                businessData.imageUrls = imageUrls;
                // Additional fields
                businessData.description = document.getElementById('bizDescription').value;
                businessData.facebookLink = document.getElementById('bizFacebook').value;
                businessData.instagramLink = document.getElementById('bizInstagram').value;
                businessData.whatsappLink = document.getElementById('bizWhatsapp').value;

                await E7_DB.createBusiness(businessData);
                showToast('تم إضافة المؤسسة بنجاح!', 'success');
                document.getElementById('addBusinessForm').reset();
                loadAdminData();
                showSection('businesses');
            } catch (err) {
                alert('حدث خطأ: ' + (err.message || 'فشل في إضافة المؤسسة'));
            } finally {
                btn.textContent = 'إضافة المؤسسة';
                btn.disabled = false;
            }
        });

        function showLoadingSpinner(elementId, text) {
            const container = document.getElementById(elementId);
            container.textContent = '';
            
            const wrapper = document.createElement('div');
            wrapper.style.cssText = 'text-align:center; padding:2rem;';
            
            const spinner = document.createElement('i');
            spinner.className = 'fas fa-spinner fa-spin';
            spinner.style.cssText = 'font-size:2rem; color:var(--primary);';
            wrapper.appendChild(spinner);
            
            const p = document.createElement('p');
            p.style.cssText = 'margin-top:1rem; color:var(--text-muted);';
            p.textContent = text;
            wrapper.appendChild(p);
            
            container.appendChild(wrapper);
        }

        // Data Management
        async function loadAdminData() {
            try {
                showLoadingSpinner('adminBookingList', 'جاري الاتصال بالسيرفر وجلب البيانات...');
                showLoadingSpinner('adminBusinessList', 'جاري الاتصال بالسيرفر وجلب البيانات...');
                
                let bookings = await E7_DB.getBookings();
                let businesses = await E7_DB.getBusinesses();

                document.getElementById('totalCount').innerText = bookings.length;
                document.getElementById('pendingCount').innerText = bookings.filter(b => b.status === 'pending').length;
                document.getElementById('partnerCount').innerText = businesses.length;

                // Render Bookings
                const bookingList = document.getElementById('adminBookingList');
                bookingList.textContent = '';
                if (bookings.length === 0) {
                    const emptyP = document.createElement('p');
                    emptyP.style.cssText = 'text-align:center; color:var(--text-muted);';
                    emptyP.textContent = 'لا توجد حجوزات حالياً.';
                    bookingList.appendChild(emptyP);
                } else {
                    bookings.forEach(b => {
                        const card = document.createElement('div');
                        card.className = 'data-card';
                        
                        const statusColor = b.status === 'confirmed' ? '#10b981' : b.status === 'completed' ? '#3b82f6' : b.status === 'cancelled' ? '#ef4444' : '#f59e0b';
                        card.style.borderRight = `4px solid ${statusColor}`;

                        // Info container
                        const infoDiv = document.createElement('div');
                        infoDiv.style.cssText = 'text-align: right;';

                        // Header wrapper for status badge and partner name
                        const headerDiv = document.createElement('div');
                        headerDiv.style.cssText = 'display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem;';

                        // Badge span
                        const statusBadge = document.createElement('span');
                        statusBadge.style.cssText = `font-size:0.65rem; font-weight:700; padding:0.15rem 0.4rem; border-radius:5px; background: ${b.status === 'confirmed' ? '#d1fae5; color:#059669;' : b.status === 'completed' ? '#dbeafe; color:#1d4ed8;' : b.status === 'cancelled' ? '#fee2e2; color:#dc2626;' : '#fef3c7; color:#d97706;'}`;
                        statusBadge.textContent = b.status === 'confirmed' ? 'مؤكد' : b.status === 'completed' ? 'مكتمل' : b.status === 'cancelled' ? 'ملغي' : 'قيد المراجعة';
                        headerDiv.appendChild(statusBadge);

                        // Partner name strong
                        const partnerStrong = document.createElement('strong');
                        partnerStrong.textContent = b.businessName;
                        headerDiv.appendChild(partnerStrong);

                        infoDiv.appendChild(headerDiv);

                        // Service / Time details
                        const detailsP = document.createElement('p');
                        detailsP.style.cssText = 'font-size:0.8rem; color:var(--text-muted);';
                        
                        let dateStr = '';
                        try {
                            dateStr = new Date(b.startTime).toLocaleDateString('ar-SA');
                        } catch (e) {
                            dateStr = b.startTime || '';
                        }
                        detailsP.textContent = `${b.service} - ${dateStr}`;
                        infoDiv.appendChild(detailsP);

                        card.appendChild(infoDiv);

                        // Actions wrapper
                        const actionDiv = document.createElement('div');
                        actionDiv.style.cssText = 'display:flex; gap:0.5rem;';

                        const bookingId = b.id || b.Id;

                        if (b.status === 'pending') {
                            const confirmBtn = document.createElement('button');
                            confirmBtn.className = 'btn btn-primary';
                            confirmBtn.style.cssText = 'padding:0.4rem 0.8rem; font-size:0.7rem; background:#10b981;';
                            confirmBtn.onclick = function() { updateStatus(bookingId, 'confirmed'); };
                            confirmBtn.textContent = 'تأكيد';
                            actionDiv.appendChild(confirmBtn);

                            const rejectBtn = document.createElement('button');
                            rejectBtn.className = 'btn btn-outline';
                            rejectBtn.style.cssText = 'padding:0.4rem 0.8rem; font-size:0.7rem; color:#ef4444; border-color:#ef4444;';
                            rejectBtn.onclick = function() { updateStatus(bookingId, 'cancelled'); };
                            rejectBtn.textContent = 'رفض';
                            actionDiv.appendChild(rejectBtn);
                        }

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'btn btn-outline';
                        deleteBtn.style.cssText = 'padding:0.4rem 0.8rem; font-size:0.7rem; color:gray; border-color:gray;';
                        deleteBtn.onclick = function() { adminDeleteBooking(bookingId); };
                        
                        const trashIcon = document.createElement('i');
                        trashIcon.className = 'fa-solid fa-trash';
                        deleteBtn.appendChild(trashIcon);
                        actionDiv.appendChild(deleteBtn);

                        card.appendChild(actionDiv);
                        bookingList.appendChild(card);
                    });
                }

                // Render Businesses
                const businessList = document.getElementById('adminBusinessList');
                businessList.textContent = '';
                if (businesses.length === 0) {
                    const emptyP = document.createElement('p');
                    emptyP.style.cssText = 'text-align:center; color:var(--text-muted);';
                    emptyP.textContent = 'لا توجد مؤسسات في قاعدة البيانات حتى الآن.';
                    businessList.appendChild(emptyP);
                } else {
                    businesses.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'data-card';
                        
                        const statusColor = p.status === 'active' ? '#10b981' : '#f59e0b';
                        card.style.borderRight = `4px solid ${statusColor}`;

                        // Content wrapper (image and text info)
                        const contentDiv = document.createElement('div');
                        contentDiv.style.cssText = 'display:flex; align-items:center; gap:1rem;';

                        const imgContainer = document.createElement('div');
                        imgContainer.style.cssText = 'display:flex; gap:0.5rem;';
                        const images = p.imageUrls || (p.imageUrl ? [p.imageUrl] : []);
                        if (images.length === 0) {
                            const img = document.createElement('img');
                            img.src = 'img/logo.png';
                            img.style.cssText = 'width:40px; height:40px; border-radius:8px; object-fit:cover;';
                            imgContainer.appendChild(img);
                        } else {
                            images.forEach(url => {
                                const img = document.createElement('img');
                                img.src = url;
                                img.style.cssText = 'width:40px; height:40px; border-radius:8px; object-fit:cover;';
                                imgContainer.appendChild(img);
                            });
                        }
                        contentDiv.appendChild(imgContainer);

                        const textDiv = document.createElement('div');
                        
                        const nameStrong = document.createElement('strong');
                        nameStrong.textContent = p.name;
                        textDiv.appendChild(nameStrong);

                        const catP = document.createElement('p');
                        catP.style.cssText = 'font-size:0.8rem; color:var(--text-muted);';
                        catP.textContent = `${p.category} - السعة: ${p.capacity}`;
                        textDiv.appendChild(catP);

                        const credsP = document.createElement('p');
                        credsP.style.cssText = 'font-size:0.75rem; color:#6b7280;';
                        credsP.textContent = `اسم المستخدم: ${p.username || 'غير محدد'} | كلمة السر: ${p.passwordHash || 'غير محدد'}`;
                        textDiv.appendChild(credsP);

                        contentDiv.appendChild(textDiv);
                        card.appendChild(contentDiv);

                        // Actions wrapper
                        const actionDiv = document.createElement('div');
                        actionDiv.style.cssText = 'display:flex; gap:0.5rem; flex-wrap:wrap;';

                        const bizId = p.id || p.Id;

                        const credsBtn = document.createElement('button');
                        credsBtn.className = 'btn btn-outline';
                        credsBtn.style.cssText = 'padding:0.4rem 0.8rem; font-size:0.7rem; color:#3b82f6; border-color:#3b82f6;';
                        credsBtn.onclick = function() { showBusinessCredentials(bizId); };
                        const keyIcon = document.createElement('i');
                        keyIcon.className = 'fa-solid fa-key';
                        credsBtn.appendChild(keyIcon);
                        credsBtn.appendChild(document.createTextNode(' عرض كلمة السر'));
                        actionDiv.appendChild(credsBtn);

                        const editBtn = document.createElement('button');
                        editBtn.className = 'btn btn-outline';
                        editBtn.style.cssText = 'padding:0.4rem 0.8rem; font-size:0.7rem; color:#f59e0b; border-color:#f59e0b;';
                        editBtn.onclick = function() { editBusiness(bizId); };
                        const editIcon = document.createElement('i');
                        editIcon.className = 'fa-solid fa-edit';
                        editBtn.appendChild(editIcon);
                        editBtn.appendChild(document.createTextNode(' تعديل'));
                        actionDiv.appendChild(editBtn);

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'btn btn-outline';
                        deleteBtn.style.cssText = 'padding:0.4rem 0.8rem; font-size:0.7rem; color:#ef4444; border-color:#ef4444;';
                        deleteBtn.onclick = function() { adminDeleteBusiness(bizId); };
                        const trashIcon = document.createElement('i');
                        trashIcon.className = 'fa-solid fa-trash';
                        deleteBtn.appendChild(trashIcon);
                        deleteBtn.appendChild(document.createTextNode(' حذف'));
                        actionDiv.appendChild(deleteBtn);

                        card.appendChild(actionDiv);
                        businessList.appendChild(card);
                    });
                }
            } catch (err) {
                console.error("Failed to load admin data:", err);
                const errorPara = document.createElement('p');
                errorPara.style.cssText = 'text-align:center; color:red;';
                errorPara.textContent = 'حدث خطأ أثناء جلب البيانات من السيرفر.';
                document.getElementById('adminBookingList').textContent = '';
                document.getElementById('adminBookingList').appendChild(errorPara);
            }
        }
        // Credentials Modal
        const credModalHtml = `
        <div id="credBizModal" class="modal-overlay" style="display:none;">
            <div class="modal-content" style="max-width:400px; text-align:right;">
                <span class="modal-close" onclick="closeCredModal()" style="cursor:pointer;float:left;">&times;</span>
                <h3 style="margin-bottom:1rem; color:var(--primary);">بيانات الدخول للمؤسسة</h3>
                <p><strong>اسم المستخدم:</strong> <span id="credBizUsername"></span></p>
                <p><strong>كلمة السر:</strong> <span id="credBizPassword" data-visible="false" data-real=""></span> <button id="togglePwdBtn" class="btn btn-outline" style="margin-left:0.5rem;" onclick="togglePasswordVisibility()">إظهار كلمة السر</button></p>
                <button class="btn btn-primary" style="margin-top:1rem; width:100%;" onclick="closeCredModal()">إغلاق</button>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', credModalHtml);
        // Ensure password stored for toggle

        showBusinessCredentials = async function(id) {
            try {
                const res = await fetch(`${API_BASE_URL}/Businesses/${id}/credentials`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('credBizUsername').textContent = data.Username;
                    const pwdSpan = document.getElementById('credBizPassword');
                    pwdSpan.dataset.real = data.Password;
                    pwdSpan.textContent = '••••••••';
                    pwdSpan.dataset.visible = 'false';
                    document.getElementById('togglePwdBtn').textContent = 'إظهار كلمة السر';
                    document.getElementById('credBizModal').style.display = 'flex';
                } else {
                    showToast('فشل في جلب بيانات الدخول', 'error');
                }
            } catch (err) {
                showToast('حدث خطأ: ' + err.message, 'error');
            }
        };

        async function updateStatus(id, status) {
            try {
                await E7_DB.updateBookingStatus(id, status);
                showToast(status === 'confirmed' ? 'تم تأكيد الحجز' : 'تم رفض الحجز', 'success');
                loadAdminData();
            } catch (err) {
                console.error('Error updating status:', err);
                showToast('فشل في تحديث حالة الحجز', 'error');
            }
        }

        async function adminDeleteBooking(id) {
            if(confirm("هل أنت متأكد من حذف هذا الحجز نهائياً؟")) {
                await E7_DB.deleteBooking(id);
                loadAdminData();
            }
        }

        async function adminDeleteBusiness(id) {
            if(confirm("تحذير: سيتم حذف هذه المؤسسة من قاعدة البيانات بالكامل. هل أنت متأكد؟")) {
                await E7_DB.deleteBusiness(id);
                loadAdminData();
            }
        }



        function togglePasswordVisibility() {
            const pwdElem = document.getElementById('credBizPassword');
            if (pwdElem.dataset.visible === 'true') {
                pwdElem.textContent = '••••••••';
                pwdElem.dataset.visible = 'false';
                document.getElementById('togglePwdBtn').textContent = 'إظهار كلمة السر';
            } else {
                // The real password is stored in a data attribute for toggle
                pwdElem.textContent = pwdElem.dataset.real;
                pwdElem.dataset.visible = 'true';
                document.getElementById('togglePwdBtn').textContent = 'إخفاء كلمة السر';
            }
        }

        function closeCredModal() {
            document.getElementById('credBizModal').style.display = 'none';
        }

        async function editBusiness(id) {
            const business = (await E7_DB.getBusinesses()).find(b => (b.id || b.Id) === id);
            if (!business) {
                alert('المؤسسة غير موجودة');
                return;
            }

            document.getElementById('editBizId').value = business.id || business.Id;
            document.getElementById('editBizName').value = business.name || '';
            document.getElementById('editBizCategory').value = business.category || '';
            document.getElementById('editBizCapacity').value = business.capacity || 1;
            document.getElementById('editBizUsername').value = business.username || '';
            document.getElementById('editBizPhone').value = business.phoneNumber || '';
            document.getElementById('editBizPassword').value = '';

            document.getElementById('editBusinessModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editBusinessModal').style.display = 'none';
        }

        document.getElementById('editBusinessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editBizId').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = ' جاري الحفظ...';
            const spinner = document.createElement('i');
            spinner.className = 'fa-solid fa-spinner fa-spin';
            btn.prepend(spinner);
            btn.disabled = true;

            const updateData = {
                name: document.getElementById('editBizName').value,
                category: document.getElementById('editBizCategory').value,
                capacity: parseInt(document.getElementById('editBizCapacity').value),
                username: document.getElementById('editBizUsername').value,
                phoneNumber: document.getElementById('editBizPhone').value
            };
            const pwd = document.getElementById('editBizPassword').value.trim();
            if (pwd) updateData.password = pwd;

            try {
                const res = await fetch(`${API_BASE_URL}/Businesses/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });
                if (res.ok) {
                    alert('تم تحديث بيانات المؤسسة بنجاح!');
                    closeEditModal();
                    loadAdminData();
                } else {
                    alert('فشل في تحديث بيانات المؤسسة');
                }
            } catch (err) {
                alert('حدث خطأ: ' + err.message);
            } finally {
                btn.textContent = 'حفظ التعديلات';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
