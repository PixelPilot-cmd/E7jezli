<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | E7jezli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root { --admin-sidebar: #1e293b; }
        body { background: #f8fafc; }
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar { 
            width: 260px; background: var(--admin-sidebar); color: white; 
            padding: 2rem 1.5rem; transition: 0.3s; position: sticky; top: 0; height: 100vh;
        }
        .admin-nav { list-style: none; margin-top: 3rem; }
        .admin-nav li { margin-bottom: 0.5rem; }
        .admin-nav a { 
            display: flex; align-items: center; gap: 1rem; padding: 1rem; 
            color: #cbd5e1; border-radius: 12px; transition: 0.3s; text-decoration: none; cursor: pointer;
        }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; }
        .admin-main { flex: 1; padding: 2rem; overflow-x: hidden; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: var(--shadow-soft); border: 1px solid var(--border); }
        .stat-card i { font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }
        .stat-card h3 { font-size: 0.9rem; color: var(--text-muted); }
        .stat-card p { font-size: 1.8rem; font-weight: 800; margin-top: 0.5rem; }

        @media (max-width: 992px) {
            .admin-sidebar { position: fixed; right: -100%; z-index: 1000; height: 100vh; }
            .admin-sidebar.active { right: 0; }
            .mobile-admin-header { 
                display: flex !important; justify-content: space-between; align-items: center;
                background: white; padding: 1rem; border-bottom: 1px solid var(--border);
                position: sticky; top: 0; z-index: 999;
            }
            .admin-main { padding: 1rem; }
        }

        .data-card { 
            background: white; border-radius: 20px; padding: 1.2rem; margin-bottom: 1rem;
            border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
    </style>
</head>
<body>

    <div class="mobile-admin-header" style="display: none;">
        <a href="index.html" class="logo"><img src="img/logo.png" alt="E7jezli" style="height: 40px;"></a>
        <button class="btn btn-outline" id="adminMenuToggle" style="padding: 0.5rem;"><i class="fa-solid fa-bars-staggered"></i></button>
    </div>

    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <img src="img/logo.png" alt="E7jezli" style="height: 50px; filter: brightness(0) invert(1);">
            </div>
            <ul class="admin-nav">
                <li><a onclick="showSection('stats', this)" class="nav-item active"><i class="fa-solid fa-chart-line"></i> الإحصائيات</a></li>
                <li><a onclick="showSection('bookings', this)" class="nav-item"><i class="fa-solid fa-calendar-check"></i> الحجوزات</a></li>
                <li><a onclick="showSection('partners', this)" class="nav-item"><i class="fa-solid fa-users"></i> الشركاء</a></li>
                <li><a href="index.html" style="margin-top: 5rem; color: #f87171;"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <!-- Stats Section -->
            <div id="statsSection" class="admin-section active">
                <header style="margin-bottom: 2rem;"><h1 style="font-size: 1.5rem; font-weight: 800;">إحصائيات المنصة</h1></header>
                <div class="stats-grid">
                    <div class="stat-card"><i class="fa-solid fa-calendar-day"></i><h3>إجمالي الحجوزات</h3><p id="totalCount">0</p></div>
                    <div class="stat-card"><i class="fa-solid fa-coins"></i><h3>إجمالي الدخل</h3><p id="totalIncome">0 ₪</p></div>
                    <div class="stat-card"><i class="fa-solid fa-user-plus"></i><h3>الشركاء</h3><p id="partnerCount">0</p></div>
                </div>
            </div>

            <!-- Bookings Section -->
            <div id="bookingsSection" class="admin-section">
                <header style="margin-bottom: 2rem;"><h1 style="font-size: 1.5rem; font-weight: 800;">إدارة الحجوزات</h1></header>
                <div id="adminBookingList"></div>
            </div>

            <!-- Partners Section -->
            <div id="partnersSection" class="admin-section">
                <header style="margin-bottom: 2rem;"><h1 style="font-size: 1.5rem; font-weight: 800;">إدارة الشركاء</h1></header>
                <div id="adminPartnerList"></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        function showSection(id, element) {
            // Hide all sections
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            // Remove active class from all nav items
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            // Show target section
            const target = document.getElementById(id + 'Section');
            if(target) target.classList.add('active');
            
            // Highlight active nav item
            if(element) element.classList.add('active');
            
            // Close sidebar on mobile
            if(window.innerWidth < 992) {
                document.getElementById('adminSidebar').classList.remove('active');
            }
        }

        const toggleBtn = document.getElementById('adminMenuToggle');
        if(toggleBtn) toggleBtn.onclick = () => document.getElementById('adminSidebar').classList.toggle('active');

        document.addEventListener('DOMContentLoaded', loadAdminData);

        async function loadAdminData() {
            try {
                let bookings = await E7_DB.getBookings();
                let partners = await E7_DB.getBusinesses();

                // If empty, add a dummy booking for demonstration
                if(bookings.length === 0) {
                    bookings = [{ id: 1, businessName: 'صالون الأناقة', service: 'حلاقة رجالي', date: '2026-05-17', price: 50, status: 'pending' }];
                }
                if(partners.length === 0) {
                    partners = [{ name: 'مطعم القلعة', image: 'img/al-aqsa.png' }];
                }

                // Fill Stats
                document.getElementById('totalCount').innerText = bookings.length;
                document.getElementById('totalIncome').innerText = bookings.reduce((acc, b) => acc + (parseInt(b.price) || 0), 0) + ' ₪';
                document.getElementById('partnerCount').innerText = partners.length;

                // Fill Bookings
                const bookingList = document.getElementById('adminBookingList');
                bookingList.innerHTML = bookings.map(b => `
                    <div class="data-card" style="border-right: 4px solid ${b.status === 'approved' ? '#10b981' : '#f59e0b'};">
                        <div style="text-align: right;">
                            <strong>${b.businessName}</strong>
                            <p style="font-size:0.8rem; color:var(--text-muted);">${b.date} - ${b.service}</p>
                        </div>
                        <div style="display:flex; gap:0.5rem;">
                            <button class="btn btn-primary" style="padding:0.4rem 0.8rem; font-size:0.7rem; background:#10b981;" onclick="updateStatus(${b.id}, 'approved')">قبول</button>
                            <button class="btn btn-outline" style="padding:0.4rem 0.8rem; font-size:0.7rem; color:#ef4444; border-color:#ef4444;" onclick="updateStatus(${b.id}, 'rejected')">رفض</button>
                        </div>
                    </div>
                `).join('');

                // Fill Partners
                const partnerList = document.getElementById('adminPartnerList');
                partnerList.innerHTML = partners.map(p => `
                    <div class="data-card">
                        <div style="display:flex; align-items:center; gap:1rem;">
                            <img src="${p.image || 'img/al-aqsa.png'}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;">
                            <strong>${p.name}</strong>
                        </div>
                        <button class="btn btn-outline" style="padding:0.4rem 0.8rem; font-size:0.7rem;">تعديل</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Failed to load admin data:", err);
            }
        }

        async function updateStatus(id, status) {
            await E7_DB.updateBookingStatus(id, status);
            alert('تم تحديث حالة الحجز بنجاح');
            loadAdminData();
        }
    </script>
</body>
</html>
