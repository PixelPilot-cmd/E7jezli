<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدخول والتسجيل | E7jezli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .auth-container { max-width: 450px; margin: 5rem auto; padding: 2rem; background: white; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .tab { flex: 1; text-align: center; padding: 1rem; cursor: pointer; color: var(--text-muted); font-weight: 700; transition: 0.3s; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 12px; outline: none; }
    </style>
</head>
<body style="background: var(--bg-main);">
    <div class="container">
        <div class="auth-container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <a href="index.html" class="logo" style="justify-content: center;"><i class="fa-solid fa-calendar-check"></i> E7jezli</a>
            </div>
            
            <div class="auth-tabs">
                <div class="tab active" onclick="switchTab('login')">تسجيل الدخول</div>
                <div class="tab" onclick="switchTab('register')">إنشاء حساب جديد</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1.2rem;">دخول</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="regName" required placeholder="أدخل اسمك بالكامل">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="regEmail" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="regPass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1.2rem;">إنشاء الحساب</button>
                <p style="text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 1rem;">سوف نرسل كود التحقق لبريدك الإلكتروني</p>
            </form>
        </div>
    </div>

    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (type === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function handleAuth(e, type) {
            e.preventDefault();
            if (type === 'register') {
                const name = document.getElementById('regName').value;
                // محاكاة تسجيل
                localStorage.setItem('user_profile', JSON.stringify({
                    name: name,
                    email: document.getElementById('regEmail').value,
                    points: 150 // نقاط ترحيبية
                }));
                alert('تم إنشاء الحساب بنجاح! تم منحك 150 نقطة ولاء ترحيبية.');
            }
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
