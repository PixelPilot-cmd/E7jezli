<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب | E7jezli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.1), transparent), var(--bg-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: var(--bg-card);
            padding: 3.5rem;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 480px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.4);
            text-align: center;
        }
        .form-group { text-align: right; margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.75rem; color: var(--text-muted); font-weight: 700; }
        .form-group input { 
            width: 100%; padding: 1.25rem; background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none;
        }
        .form-group input:focus { border-color: var(--primary); background: rgba(255,255,255,0.05); }
        .auth-tabs { display: flex; background: rgba(255,255,255,0.03); padding: 0.5rem; border-radius: 12px; margin-bottom: 3rem; }
        .auth-tab { flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-weight: 700; border-radius: 10px; transition: 0.3s; }
        .auth-tab.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="logo" style="justify-content:center; margin-bottom: 2.5rem;">
            <i class="fa-solid fa-calendar-check"></i> <span>E7jezli</span>
        </a>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuth('login')">تسجيل الدخول</button>
            <button class="auth-tab" onclick="switchAuth('register')">إنشاء حساب</button>
        </div>

        <form id="authForm" onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div id="loginFields">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" placeholder="name@domain.ps">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" placeholder="••••••••">
                </div>
            </div>

            <div id="registerFields" style="display: none;">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" placeholder="أدخل اسمك الثلاثي">
                </div>
                <!-- ... other fields ... -->
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 60px; margin-top: 1rem;">دخول للمنصة</button>
        </form>

        <p style="margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
            منصة فلسطينية آمنة 100% لمواطني الضفة الغربية.
        </p>
    </div>

    <script>
        function switchAuth(type) {
            const tabs = document.querySelectorAll('.auth-tab');
            const loginFields = document.getElementById('loginFields');
            const registerFields = document.getElementById('registerFields');

            tabs.forEach(t => t.classList.remove('active'));
            if (type === 'login') {
                tabs[0].classList.add('active');
                loginFields.style.display = 'block';
                registerFields.style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                loginFields.style.display = 'none';
                registerFields.style.display = 'block';
            }
        }
    </script>
</body>
</html>
