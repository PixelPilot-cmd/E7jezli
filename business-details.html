<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخدمة | E7jezli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .details-wrapper { padding: 4rem 0; }
        .details-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 4rem; }
        .biz-header { margin-bottom: 2rem; }
        .biz-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .main-img-box { width: 100%; height: 450px; border-radius: 20px; overflow: hidden; margin-bottom: 1.5rem; box-shadow: var(--shadow-soft); }
        .main-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .booking-sidebar { background: white; padding: 2rem; border-radius: 20px; border: 1px solid var(--border); position: sticky; top: 120px; box-shadow: var(--shadow-soft); }
        .service-option { 
            background: var(--bg-main); padding: 1rem; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            margin-bottom: 1rem; border: 1px solid var(--border); transition: 0.3s;
        }
        .service-option:hover, .service-option.active { border-color: var(--primary); background: var(--primary-light); }
        .time-slot { width: 100%; padding: 0.8rem; border-radius: 10px; font-size: 0.9rem; }

        /* Payment Modal Specifics */
        .pay-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .pay-tab { cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; color: var(--text-muted); }
        .pay-tab.active { background: var(--primary); color: white; }
        .payment-form input { margin-bottom: 1rem; width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); }
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .wallet-item { border: 1px solid var(--border); padding: 1.5rem; border-radius: 15px; cursor: pointer; transition: 0.3s; text-align: center; }
        .wallet-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .wallet-item i { font-size: 2rem; display: block; margin-bottom: 0.5rem; color: var(--primary); }
    </style>
</head>
<body>

    <header class="header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo"><img src="img/logo.png" alt="E7jezli"></a>
            <div class="auth-buttons"><a href="index.html" class="btn btn-outline">العودة للرئيسية</a></div>
        </div>
    </header>

    <main class="container details-wrapper" id="detailsMain">
        <div class="loading-state" style="text-align:center; padding: 10rem 0;">جاري تحميل تفاصيل المنشأة...</div>
    </main>

    <!-- Form is now in sidebar -->

    <script src="js/api.js"></script>
    <script>
        let currentBiz = null;
        let selectedService = "";
        let selectedPrice = 0;
        let selectedTime = "";

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const bizId = params.get('id');
            currentBiz = await E7_DB.getBusinessById(bizId);

            if (!currentBiz) {
                document.getElementById('detailsMain').innerHTML = `<div style="text-align:center; padding: 10rem 0;"><h2>المشروع غير موجود</h2></div>`;
                return;
            }



            // Secondary Images HTML
            let secondaryImgsHTML = '';
            if (currentBiz.secondaryImages) {
                secondaryImgsHTML = `
                    <div style="margin-top: 2rem;">
                        <h4 style="margin-bottom:1rem;">صور إضافية للمنشأة</h4>
                        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:1rem;">
                            ${currentBiz.secondaryImages.split(',').map(imgSrc => `<img src="${imgSrc}" style="width:100%; height:120px; object-fit:cover; border-radius:12px; border:1px solid var(--border);">`).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('detailsMain').innerHTML = `
                <div class="biz-header">
                    <h1>${currentBiz.name}</h1>
                    <p><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> فلسطين - ${currentBiz.location} (${currentBiz.category})</p>
                </div>
                <div class="details-grid">
                    <section class="content-area">
                        <div class="main-img-box"><img src="${currentBiz.img || currentBiz.imageUrl}"></div>
                        <div style="background: white; padding: 2rem; border-radius: 20px; border: 1px solid var(--border);">
                            <h3>عن المشروع</h3>
                            <p style="color:var(--text-muted); line-height: 1.8; margin-top: 1rem;">${currentBiz.description || `هذا المشروع هو أحد شركاء منصة E7jezli الرسميين في مدينة ${currentBiz.location}.`}</p>
                        </div>
                        ${secondaryImgsHTML}
                    </section>
                    <aside class="sidebar-area">
                        <div class="booking-sidebar">
                            <h4 style="margin-bottom:1.5rem; font-size:1.3rem;">تقديم طلب حجز جديد</h4>
                            <form id="bookingForm" onsubmit="submitBooking(event)">
                                <div style="margin-bottom: 1rem;">
                                    <label style="font-weight:700; margin-bottom:0.5rem; display:block;">نوع الحجز</label>
                                    <input type="text" id="b_type" required placeholder="مثال: خدمة تصوير، طاولة لشخصين..." style="width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;">
                                </div>
                                <div style="margin-bottom: 1rem;">
                                    <label style="font-weight:700; margin-bottom:0.5rem; display:block;">الغرض من الحجز (تفاصيل)</label>
                                    <textarea id="b_purpose" required placeholder="اكتب غرضك من الحجز أو تفاصيل إضافية" rows="3" style="width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none; resize:none;"></textarea>
                                </div>
                                <div style="display:flex; gap:1rem; margin-bottom: 1rem;">
                                    <div style="flex:1;">
                                        <label style="font-weight:700; margin-bottom:0.5rem; display:block;">تاريخ الحجز</label>
                                        <input type="date" id="b_date" required style="width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;">
                                    </div>
                                    <div style="flex:1;">
                                        <label style="font-weight:700; margin-bottom:0.5rem; display:block;">الوقت</label>
                                        <input type="time" id="b_time" required style="width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;">
                                    </div>
                                </div>
                                <div style="margin-bottom: 1.5rem;">
                                    <label style="font-weight:700; margin-bottom:0.5rem; display:block;">رقم الجوال للتواصل</label>
                                    <input type="tel" id="b_phone" required placeholder="059xxxxxxx" style="width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;">
                                </div>
                                <button type="submit" class="btn btn-primary" id="bookSubmitBtn" style="width:100%; justify-content:center; padding:1rem;">تأكيد وتقديم الطلب</button>
                            </form>
                        </div>
                    </aside>
                </div>
            `;
        });

        async function submitBooking(e) {
            e.preventDefault();
            
            // Authentication check
            if (!localStorage.getItem('user_profile')) {
                localStorage.setItem('redirect_after_login', window.location.href);
                window.location.href = 'auth.html';
                return;
            }

            const btn = document.getElementById('bookSubmitBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال الطلب...';
            btn.disabled = true;

            const type = document.getElementById('b_type').value;
            const purpose = document.getElementById('b_purpose').value;
            const date = document.getElementById('b_date').value;
            const time = document.getElementById('b_time').value;
            const phone = document.getElementById('b_phone').value;

            // Generate unique booking number
            const bookingId = "E7-" + Math.floor(10000 + Math.random() * 90000);
            const fullService = `رقم الحجز: ${bookingId} | النوع: ${type} | الغرض: ${purpose} | جوال: ${phone}`;

            const profile = JSON.parse(localStorage.getItem('user_profile'));
            
            // Ensure we have the user's id
            let userId = profile ? profile.id : null;
            if (!userId && profile && profile.email) {
                try {
                    const freshUser = await E7_DB.getUserProfile(profile.email);
                    if (freshUser && freshUser.id) {
                        userId = freshUser.id;
                        profile.id = freshUser.id;
                        localStorage.setItem('user_profile', JSON.stringify(profile));
                    }
                } catch (ignored) {}
            }
            if (!userId) {
                alert("يرجى تسجيل الدخول أولاً.");
                localStorage.setItem('redirect_after_login', window.location.href);
                window.location.href = 'auth.html';
                return;
            }

            const booking = { 
                BusinessId: currentBiz.id,
                UserId: userId,
                Service: fullService,
                Notes: `التاريخ: ${date} | الوقت: ${time} | المنشأة: ${currentBiz.name}`,
                Price: 0
            };

            try {
                await E7_DB.saveBooking(booking);
                setTimeout(() => {
                    window.location.href = 'my-bookings.html?success=true';
                }, 1000);
            } catch (err) {
                console.error("Booking error:", err);
                alert("حدث خطأ أثناء إرسال الطلب. يرجى المحاولة لاحقاً.\n" + (err.message || ""));
                btn.innerHTML = 'تأكيد وتقديم الطلب';
                btn.disabled = false;
            }
        }
    </script>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div>جميع الحقوق محفوظة © 2026 إحجزلي</div>
                <div class="payment-methods">
                    <i class="fa-brands fa-cc-visa"></i>
                    <i class="fa-brands fa-cc-mastercard"></i>
                    <i class="fa-brands fa-apple-pay"></i>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
