<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخدمة | E7jezli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .details-wrapper { padding: 4rem 0; }
        .details-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 4rem; }
        .biz-header { margin-bottom: 2rem; }
        .biz-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .main-img-box { width: 100%; height: 450px; border-radius: 20px; overflow: hidden; margin-bottom: 1.5rem; box-shadow: var(--shadow-soft); }
        .main-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .booking-sidebar { background: white; padding: 2rem; border-radius: 20px; border: 1px solid var(--border); position: sticky; top: 120px; box-shadow: var(--shadow-soft); }
        .service-option { 
            background: var(--bg-main); padding: 1rem; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            margin-bottom: 1rem; border: 1px solid var(--border); transition: 0.3s;
        }
        .service-option:hover, .service-option.active { border-color: var(--primary); background: var(--primary-light); }
        .time-slot { width: 100%; padding: 0.8rem; border-radius: 10px; font-size: 0.9rem; }

        /* Payment Modal Specifics */
        .pay-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .pay-tab { cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; color: var(--text-muted); }
        .pay-tab.active { background: var(--primary); color: white; }
        .payment-form input { margin-bottom: 1rem; width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); }
        .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .wallet-item { border: 1px solid var(--border); padding: 1.5rem; border-radius: 15px; cursor: pointer; transition: 0.3s; text-align: center; }
        .wallet-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .wallet-item i { font-size: 2rem; display: block; margin-bottom: 0.5rem; color: var(--primary); }
    </style>
</head>
<body>

    <header class="header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo"><img src="img/logo.png" alt="E7jezli"></a>
            <div class="auth-buttons"><a href="index.html" class="btn btn-outline">العودة للرئيسية</a></div>
        </div>
    </header>

    <main class="container details-wrapper" id="detailsMain">
        <div class="loading-state" style="text-align:center; padding: 10rem 0;">جاري تحميل تفاصيل المنشأة...</div>
    </main>

    <!-- Form is now in sidebar -->

    <script src="js/api.js"></script>
    <script>
        let currentBiz = null;
        let selectedService = "";
        let selectedPrice = 0;
        let selectedTime = "";

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const bizId = params.get('id');
            currentBiz = await E7_DB.getBusinessById(bizId);

            if (!currentBiz) {
                const detailsDiv = document.getElementById('detailsMain');
                detailsDiv.textContent = '';
                const emptyWrapper = document.createElement('div');
                emptyWrapper.style.cssText = 'text-align:center; padding: 10rem 0;';
                const emptyH2 = document.createElement('h2');
                emptyH2.textContent = 'المشروع غير موجود';
                emptyWrapper.appendChild(emptyH2);
                detailsDiv.appendChild(emptyWrapper);
                return;
            }

            const detailsMain = document.getElementById('detailsMain');
            detailsMain.textContent = '';

            // Header Container
            const bizHeader = document.createElement('div');
            bizHeader.className = 'biz-header';

            const h1 = document.createElement('h1');
            h1.textContent = currentBiz.name;
            bizHeader.appendChild(h1);

            const pInfo = document.createElement('p');
            const mapIcon = document.createElement('i');
            mapIcon.className = 'fa-solid fa-location-dot';
            mapIcon.style.color = 'var(--primary)';
            pInfo.appendChild(mapIcon);
            pInfo.appendChild(document.createTextNode(` فلسطين - ${currentBiz.location} (${currentBiz.category})`));
            bizHeader.appendChild(pInfo);

            detailsMain.appendChild(bizHeader);

            // Grid Layout
            const detailsGrid = document.createElement('div');
            detailsGrid.className = 'details-grid';

            // Content Area
            const contentArea = document.createElement('section');
            contentArea.className = 'content-area';

            // Main Image Box
            const mainImgBox = document.createElement('div');
            mainImgBox.className = 'main-img-box';
            const mainImg = document.createElement('img');
            mainImg.src = currentBiz.img || currentBiz.imageUrl || 'img/logo.png';
            mainImg.alt = currentBiz.name;
            mainImgBox.appendChild(mainImg);
            contentArea.appendChild(mainImgBox);

            // About Box
            const aboutBox = document.createElement('div');
            aboutBox.style.cssText = 'background: white; padding: 2rem; border-radius: 20px; border: 1px solid var(--border);';
            const aboutHeading = document.createElement('h3');
            aboutHeading.textContent = 'عن المشروع';
            aboutBox.appendChild(aboutHeading);
            
            const aboutPara = document.createElement('p');
            aboutPara.style.cssText = 'color:var(--text-muted); line-height: 1.8; margin-top: 1rem;';
            aboutPara.textContent = currentBiz.description || `هذا المشروع هو أحد شركاء منصة E7jezli الرسميين في مدينة ${currentBiz.location}.`;
            aboutBox.appendChild(aboutPara);
            contentArea.appendChild(aboutBox);

            // Secondary Images
            if (currentBiz.secondaryImages) {
                const secWrapper = document.createElement('div');
                secWrapper.style.marginTop = '2rem';
                
                const secHeading = document.createElement('h4');
                secHeading.style.marginBottom = '1rem';
                secHeading.textContent = 'صور إضافية للمنشأة';
                secWrapper.appendChild(secHeading);

                const secGrid = document.createElement('div');
                secGrid.style.cssText = 'display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:1rem;';

                currentBiz.secondaryImages.split(',').forEach(imgSrc => {
                    const secImg = document.createElement('img');
                    secImg.src = imgSrc.trim();
                    secImg.style.cssText = 'width:100%; height:120px; object-fit:cover; border-radius:12px; border:1px solid var(--border);';
                    secGrid.appendChild(secImg);
                });

                secWrapper.appendChild(secGrid);
                contentArea.appendChild(secWrapper);
            }

            detailsGrid.appendChild(contentArea);

            // Sidebar Area (Form)
            const sidebarArea = document.createElement('aside');
            sidebarArea.className = 'sidebar-area';

            const bookingSidebar = document.createElement('div');
            bookingSidebar.className = 'booking-sidebar';

            const sidebarHeading = document.createElement('h4');
            sidebarHeading.style.cssText = 'margin-bottom:1.5rem; font-size:1.3rem;';
            sidebarHeading.textContent = 'تقديم طلب حجز جديد';
            bookingSidebar.appendChild(sidebarHeading);

            // Form element
            const bookingForm = document.createElement('form');
            bookingForm.id = 'bookingForm';
            bookingForm.onsubmit = submitBooking;

            // Form field 1: Type
            const field1 = document.createElement('div');
            field1.style.marginBottom = '1rem';
            const label1 = document.createElement('label');
            label1.style.cssText = 'font-weight:700; margin-bottom:0.5rem; display:block;';
            label1.textContent = 'نوع الحجز';
            const input1 = document.createElement('input');
            input1.type = 'text';
            input1.id = 'b_type';
            input1.required = true;
            input1.placeholder = 'مثال: خدمة تصوير، طاولة لشخصين...';
            input1.style.cssText = 'width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;';
            field1.appendChild(label1);
            field1.appendChild(input1);
            bookingForm.appendChild(field1);

            // Form field 2: Purpose
            const field2 = document.createElement('div');
            field2.style.marginBottom = '1rem';
            const label2 = document.createElement('label');
            label2.style.cssText = 'font-weight:700; margin-bottom:0.5rem; display:block;';
            label2.textContent = 'الغرض من الحجز (تفاصيل)';
            const textarea2 = document.createElement('textarea');
            textarea2.id = 'b_purpose';
            textarea2.required = true;
            textarea2.placeholder = 'اكتب غرضك من الحجز أو تفاصيل إضافية';
            textarea2.rows = 3;
            textarea2.style.cssText = 'width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none; resize:none;';
            field2.appendChild(label2);
            field2.appendChild(textarea2);
            bookingForm.appendChild(field2);

            // Form fields row (Date / Time)
            const fieldsRow = document.createElement('div');
            fieldsRow.style.cssText = 'display:flex; gap:1rem; margin-bottom: 1rem;';

            const colDate = document.createElement('div');
            colDate.style.flex = '1';
            const labelDate = document.createElement('label');
            labelDate.style.cssText = 'font-weight:700; margin-bottom:0.5rem; display:block;';
            labelDate.textContent = 'تاريخ الحجز';
            const inputDate = document.createElement('input');
            inputDate.type = 'date';
            inputDate.id = 'b_date';
            inputDate.required = true;
            inputDate.style.cssText = 'width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;';
            colDate.appendChild(labelDate);
            colDate.appendChild(inputDate);
            fieldsRow.appendChild(colDate);

            const colTime = document.createElement('div');
            colTime.style.flex = '1';
            const labelTime = document.createElement('label');
            labelTime.style.cssText = 'font-weight:700; margin-bottom:0.5rem; display:block;';
            labelTime.textContent = 'الوقت';
            const inputTime = document.createElement('input');
            inputTime.type = 'time';
            inputTime.id = 'b_time';
            inputTime.required = true;
            inputTime.style.cssText = 'width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;';
            colTime.appendChild(labelTime);
            colTime.appendChild(inputTime);
            fieldsRow.appendChild(colTime);

            bookingForm.appendChild(fieldsRow);

            // Form field 3: Phone
            const field3 = document.createElement('div');
            field3.style.marginBottom = '1.5rem';
            const label3 = document.createElement('label');
            label3.style.cssText = 'font-weight:700; margin-bottom:0.5rem; display:block;';
            label3.textContent = 'رقم الجوال للتواصل';
            const input3 = document.createElement('input');
            input3.type = 'tel';
            input3.id = 'b_phone';
            input3.required = true;
            input3.placeholder = '059xxxxxxx';
            input3.style.cssText = 'width:100%; padding:0.8rem; border-radius:10px; border:1px solid var(--border); outline:none;';
            field3.appendChild(label3);
            field3.appendChild(input3);
            bookingForm.appendChild(field3);

            // Submit button
            const submitBtn = document.createElement('button');
            submitBtn.type = 'submit';
            submitBtn.className = 'btn btn-primary';
            submitBtn.id = 'bookSubmitBtn';
            submitBtn.style.cssText = 'width:100%; justify-content:center; padding:1rem;';
            submitBtn.textContent = 'تأكيد وتقديم الطلب';
            bookingForm.appendChild(submitBtn);

            bookingSidebar.appendChild(bookingForm);
            sidebarArea.appendChild(bookingSidebar);
            detailsGrid.appendChild(sidebarArea);

            detailsMain.appendChild(detailsGrid);
        });

        async function submitBooking(e) {
            e.preventDefault();

            // التحقق من تسجيل الدخول
            const profile = JSON.parse(localStorage.getItem('user_profile'));
            if (!profile || !profile.email) {
                localStorage.setItem('redirect_after_login', window.location.href);
                window.location.href = 'auth.html';
                return;
            }

            const btn = document.getElementById('bookSubmitBtn');
            btn.textContent = ' جاري إرسال الطلب...';
            const spinner = document.createElement('i');
            spinner.className = 'fa-solid fa-spinner fa-spin';
            btn.prepend(spinner);
            btn.disabled = true;

            const type = document.getElementById('b_type').value;
            const purpose = document.getElementById('b_purpose').value;
            const date = document.getElementById('b_date').value;
            const time = document.getElementById('b_time').value;
            const phone = document.getElementById('b_phone').value;

            // رقم حجز فريد
            const bookingId = "E7-" + Math.floor(10000 + Math.random() * 90000);
            const fullService = `رقم الحجز: ${bookingId} | النوع: ${type} | الغرض: ${purpose} | جوال: ${phone}`;

            const startTimeStr = `${date}T${time}:00`;
            const [hours, minutes] = time.split(':').map(Number);
            const endHours = (hours + 2) % 24;
            const endHoursStr = String(endHours).padStart(2, '0');
            const endMinutesStr = String(minutes).padStart(2, '0');
            let endDate = date;
            if (hours + 2 >= 24) {
                const dObj = new Date(date);
                dObj.setDate(dObj.getDate() + 1);
                endDate = dObj.toISOString().split('T')[0];
            }
            const endTimeStr = `${endDate}T${endHoursStr}:${endMinutesStr}:00`;

            const booking = {
                businessId: parseInt(currentBiz.id),
                businessName: currentBiz.name,
                businessImage: currentBiz.img || currentBiz.imageUrl || "",
                service: fullService,
                price: 0,
                time: time,
                date: date,
                startTime: startTimeStr,
                endTime: endTimeStr,
                userEmail: profile.email,
                userName: profile.name || "",
                userPhoneNumber: phone,
                status: "pending"
            };

            try {
                await E7_DB.saveBooking(booking);
                btn.textContent = ' تم إرسال الطلب بنجاح!';
                const checkIcon = document.createElement('i');
                checkIcon.className = 'fa-solid fa-circle-check';
                btn.prepend(checkIcon);
                setTimeout(() => {
                    window.location.href = 'my-bookings.html?success=true';
                }, 1000);
            } catch (err) {
                console.error("Booking error:", err);
                alert("حدث خطأ أثناء إرسال الطلب: " + (err.message || "يرجى المحاولة لاحقاً."));
                btn.textContent = 'تأكيد وتقديم الطلب';
                btn.disabled = false;
            }
        }
    </script>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div>جميع الحقوق محفوظة © 2026 إحجزلي</div>
                <div class="payment-methods">
                    <i class="fa-brands fa-cc-visa"></i>
                    <i class="fa-brands fa-cc-mastercard"></i>
                    <i class="fa-brands fa-apple-pay"></i>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
