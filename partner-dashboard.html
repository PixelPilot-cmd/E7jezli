<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الشريك | E7jezli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root { --partner-sidebar: #0f172a; }
        body { background: #f8fafc; }
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar { 
            width: 260px; background: var(--partner-sidebar); color: white; 
            padding: 2rem 1.5rem; position: sticky; top: 0; height: 100vh;
        }
        .admin-nav { list-style: none; margin-top: 3rem; }
        .admin-nav li { margin-bottom: 0.5rem; }
        .admin-nav a { 
            display: flex; align-items: center; gap: 1rem; padding: 1rem; 
            color: #cbd5e1; border-radius: 12px; transition: 0.3s; text-decoration: none; cursor: pointer;
        }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; }
        .admin-main { flex: 1; padding: 2rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: var(--shadow-soft); border: 1px solid var(--border); border-right: 4px solid var(--primary); }
        .stat-card i { font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }
        .stat-card h3 { font-size: 0.9rem; color: var(--text-muted); }
        .stat-card p { font-size: 1.8rem; font-weight: 800; margin-top: 0.5rem; }

        .data-card { 
            background: white; border-radius: 20px; padding: 1.5rem; margin-bottom: 1rem;
            border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }

        /* Login Overlay */
        .admin-login-overlay {
            position: fixed; inset: 0; background: var(--bg-main);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .admin-login-box {
            background: white; padding: 3rem; border-radius: 30px; width: 90%; max-width: 450px; text-align: center;
            box-shadow: var(--shadow-soft); border: 1px solid var(--border);
        }
        .admin-login-box select, .admin-login-box input {
            width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 12px;
            outline: none; margin-bottom: 1.5rem; text-align: right; font-size: 1rem; background: #fff;
        }
    </style>
</head>
<body>

    <!-- Partner Login -->
    <div class="admin-login-overlay" id="partnerLogin">
        <div class="admin-login-box">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;"><img src="img/logo.png" alt="E7jezli" style="height: 60px;"></a>
            <h2 style="margin-bottom: 0.5rem; font-size: 1.6rem; font-weight: 800;">بوابة الشركاء</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem; font-size:0.9rem;">أدر حجوزات منشأتك بسهولة</p>
            
            <div style="text-align: right; margin-bottom: 0.5rem;"><label style="font-weight: 600; font-size: 0.9rem;">اختر منشأتك</label></div>
            <select id="partnerSelect">
                <option value="">جاري تحميل المنشآت النشطة...</option>
            </select>

            <div style="text-align: right; margin-bottom: 0.5rem;"><label style="font-weight: 600; font-size: 0.9rem;">كلمة السر</label></div>
            <input type="password" id="partnerPwd" placeholder="" autocomplete="current-password">
            
            <button class="btn btn-primary" onclick="checkPartnerLogin()" style="width: 100%; justify-content: center; padding: 1.2rem;">دخول للوحة التحكم</button>
            <p id="loginError" style="color: #ef4444; margin-top: 1rem; display: none; font-weight: 600;">كلمة المرور غير صحيحة أو يرجى اختيار المنشأة!</p>
        </div>
    </div>

    <!-- Dashboard Layout -->
    <div class="admin-layout" style="display: none;" id="partnerLayout">
        <aside class="admin-sidebar">
            <div style="text-align:center; padding-bottom:1rem; border-bottom:1px solid #334155;">
                <img id="sideLogo" src="img/logo.png" style="width:70px; height:70px; border-radius:15px; object-fit:cover; margin-bottom:1rem;">
                <h3 id="sideName" style="font-size:1.1rem; font-weight:800;">اسم المنشأة</h3>
                <p style="font-size:0.8rem; color:#94a3b8;">شريك معتمد</p>
            </div>
            <ul class="admin-nav">
                <li><a class="nav-item active"><i class="fa-solid fa-calendar-check"></i> إدارة الحجوزات</a></li>
                <li><a onclick="partnerLogout()" style="margin-top: 5rem; color: #f87171;"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="font-size: 1.8rem; font-weight: 800;">مرحباً بك في إحجزلي 👋</h1>
                    <p style="color:var(--text-muted); margin-top:0.5rem;">هنا تظهر جميع طلبات الحجز الموجهة لمنشأتك مباشرة.</p>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card"><i class="fa-solid fa-users"></i><h3>إجمالي الحجوزات لديك</h3><p id="myTotalBookings">0</p></div>
                <div class="stat-card" style="border-right-color:#f59e0b;"><i class="fa-solid fa-bell"></i><h3 style="color:#f59e0b;">طلبات بانتظار موافقتك</h3><p id="myPendingBookings">0</p></div>
            </div>

            <div id="myBookingsList">
                <div style="text-align:center; padding:3rem;"><i class="fas fa-spinner fa-spin" style="font-size:2rem; color:var(--primary);"></i></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        let currentPartnerName = null;
        let activeBusinessesList = []; // مصفوفة لتخزين الشركاء النشطين محلياً للتحقق من كلمة المرور

        // Load partners into select box
        document.addEventListener('DOMContentLoaded', async () => {
            if(sessionStorage.getItem('partnerBiz')) {
                currentPartnerName = sessionStorage.getItem('partnerBiz');
                document.getElementById('partnerLogin').style.display = 'none';
                document.getElementById('partnerLayout').style.display = 'flex';
                loadPartnerDashboard();
            } else {
                try {
                    const partners = await E7_DB.getBusinesses();
                    activeBusinessesList = partners.filter(p => p.status === 'active');
                    const select = document.getElementById('partnerSelect');
                    select.textContent = '';
                    if (activeBusinessesList.length === 0) {
                        const opt = document.createElement('option');
                        opt.value = '';
                        opt.textContent = 'لا توجد منشآت نشطة حالياً';
                        select.appendChild(opt);
                    } else {
                        const placeholder = document.createElement('option');
                        placeholder.value = '';
                        placeholder.textContent = '-- اختر منشأتك --';
                        select.appendChild(placeholder);
                        activeBusinessesList.forEach(p => {
                            const opt = document.createElement('option');
                            opt.value = p.name;
                            opt.setAttribute('data-img', p.imageUrl || p.img || 'img/logo.png');
                            opt.textContent = p.name;
                            select.appendChild(opt);
                        });
                    }
                } catch (e) {
                    console.error("Failed to load partners for login");
                }
            }
        });

        function checkPartnerLogin() {
            const select = document.getElementById('partnerSelect');
            const pwd = document.getElementById('partnerPwd').value.trim();
            const selectedName = select.value;
            const selectedImg = select.options[select.selectedIndex]?.getAttribute('data-img');

            if (!selectedName) {
                document.getElementById('loginError').innerText = "يرجى اختيار المنشأة!";
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            // ابحث عن المنشأة في القائمة للتحقق من كلمة مرورها
            const biz = activeBusinessesList.find(b => b.name === selectedName);
            if (!biz) {
                document.getElementById('loginError').innerText = "المنشأة المحددة غير موجودة!";
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            // كلمة المرور = اسم المنشأة نفسه (نفس القيمة المختارة في القائمة)
            if (pwd === selectedName.trim()) {
                sessionStorage.setItem('partnerBiz', selectedName);
                sessionStorage.setItem('partnerImg', selectedImg);
                currentPartnerName = selectedName;
                document.getElementById('partnerLogin').style.display = 'none';
                document.getElementById('partnerLayout').style.display = 'flex';
                loadPartnerDashboard();
            } else {
                document.getElementById('loginError').innerText = "كلمة المرور غير صحيحة!";
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function partnerLogout() {
            sessionStorage.removeItem('partnerBiz');
            sessionStorage.removeItem('partnerImg');
            window.location.reload();
        }

        async function loadPartnerDashboard() {
            try {
                document.getElementById('sideName').innerText = currentPartnerName;
                document.getElementById('sideLogo').src = sessionStorage.getItem('partnerImg') || 'img/logo.png';

                let allBookings = await E7_DB.getBookings();
                // Filter bookings ONLY for this specific partner
                let myBookings = allBookings.filter(b => b.businessName === currentPartnerName);

                document.getElementById('myTotalBookings').innerText = myBookings.length;
                document.getElementById('myPendingBookings').innerText = myBookings.filter(b => b.status === 'pending').length;

                const list = document.getElementById('myBookingsList');
                list.textContent = '';
                if (myBookings.length === 0) {
                    const container = document.createElement('div');
                    container.style.textAlign = 'center';
                    container.style.padding = '4rem';
                    container.style.background = 'white';
                    container.style.borderRadius = '20px';
                    container.style.border = '1px dashed var(--border)';
                    const icon = document.createElement('i');
                    icon.className = 'fa-regular fa-folder-open';
                    icon.style.fontSize = '3rem';
                    icon.style.color = 'var(--border)';
                    icon.style.marginBottom = '1rem';
                    const heading = document.createElement('h3');
                    heading.style.color = 'var(--text-muted)';
                    heading.textContent = 'لا توجد أي حجوزات لمنشأتك حتى الآن';
                    container.appendChild(icon);
                    container.appendChild(heading);
                    list.appendChild(container);
                } else {
                    myBookings.forEach(b => {
                        const card = document.createElement('div');
                        card.className = 'data-card';
                        const color = b.status === 'approved' ? '#10b981' : b.status === 'completed' ? '#3b82f6' : b.status === 'rejected' ? '#ef4444' : '#f59e0b';
                        card.style.borderRight = `4px solid ${color}`;

                        // Info container
                        const infoDiv = document.createElement('div');
                        infoDiv.style.cssText = 'text-align: right; flex: 1;';

                        // Header wrapper for status and date
                        const headerDiv = document.createElement('div');
                        headerDiv.style.cssText = 'display:flex; align-items:center; gap:1rem; margin-bottom:0.5rem;';

                        // Status badge
                        const statusBadge = document.createElement('span');
                        statusBadge.style.cssText = `padding:0.3rem 0.6rem; border-radius:8px; font-size:0.7rem; font-weight:700; background: ${b.status === 'approved' ? '#d1fae5; color:#059669;' : b.status === 'completed' ? '#dbeafe; color:#1d4ed8;' : b.status === 'rejected' ? '#fee2e2; color:#dc2626;' : '#fef3c7; color:#d97706;'}`;
                        statusBadge.textContent = b.status === 'approved' ? 'مقبول ومؤكد' : b.status === 'completed' ? 'مكتمل' : b.status === 'rejected' ? 'مرفوض' : 'قيد المراجعة';
                        headerDiv.appendChild(statusBadge);

                        // Date & time span
                        const dateSpan = document.createElement('span');
                        dateSpan.style.cssText = 'font-size:0.8rem; color:var(--text-muted);';
                        const calIcon = document.createElement('i');
                        calIcon.className = 'fa-regular fa-calendar';
                        dateSpan.appendChild(calIcon);
                        dateSpan.appendChild(document.createTextNode(` ${b.date} | ${b.time}`));
                        headerDiv.appendChild(dateSpan);

                        infoDiv.appendChild(headerDiv);

                        // Title h4
                        const h4 = document.createElement('h4');
                        h4.style.cssText = 'margin-bottom:0.5rem; font-size:1.1rem;';
                        h4.textContent = 'تفاصيل الطلب:';
                        infoDiv.appendChild(h4);

                        // Description paragraph
                        const p = document.createElement('p');
                        p.style.cssText = 'font-size:0.9rem; color:var(--text-muted); line-height:1.6;';
                        p.textContent = b.service;
                        infoDiv.appendChild(p);

                        card.appendChild(infoDiv);

                        // Action container
                        const actionDiv = document.createElement('div');
                        actionDiv.style.cssText = 'display:flex; flex-direction:column; gap:0.5rem; margin-right:1.5rem;';

                        if (b.status === 'pending') {
                            // Accept button
                            const acceptBtn = document.createElement('button');
                            acceptBtn.className = 'btn btn-primary';
                            acceptBtn.style.cssText = 'padding:0.6rem 1.2rem; background:#10b981;';
                            acceptBtn.onclick = function() { updateMyBooking(this, b.id || b.Id, 'approved'); };
                            const checkIcon = document.createElement('i');
                            checkIcon.className = 'fa-solid fa-check';
                            acceptBtn.appendChild(checkIcon);
                            acceptBtn.appendChild(document.createTextNode(' قبول الحجز'));
                            actionDiv.appendChild(acceptBtn);

                            // Reject button
                            const rejectBtn = document.createElement('button');
                            rejectBtn.className = 'btn btn-outline';
                            rejectBtn.style.cssText = 'padding:0.6rem 1.2rem; color:#ef4444; border-color:#ef4444;';
                            rejectBtn.onclick = function() { updateMyBooking(this, b.id || b.Id, 'rejected'); };
                            const xIcon = document.createElement('i');
                            xIcon.className = 'fa-solid fa-xmark';
                            rejectBtn.appendChild(xIcon);
                            rejectBtn.appendChild(document.createTextNode(' رفض واعتذار'));
                            actionDiv.appendChild(rejectBtn);
                        } else if (b.status === 'approved') {
                            // Complete button
                            const completeBtn = document.createElement('button');
                            completeBtn.className = 'btn btn-primary';
                            completeBtn.style.cssText = 'padding:0.6rem 1.2rem; background:#3b82f6;';
                            completeBtn.onclick = function() { updateMyBooking(this, b.id || b.Id, 'completed'); };
                            const circleCheckIcon = document.createElement('i');
                            circleCheckIcon.className = 'fa-solid fa-circle-check';
                            completeBtn.appendChild(circleCheckIcon);
                            completeBtn.appendChild(document.createTextNode(' إتمام الحجز'));
                            actionDiv.appendChild(completeBtn);
                        } else if (b.status === 'completed') {
                            const completedBtn = document.createElement('button');
                            completedBtn.className = 'btn btn-outline';
                            completedBtn.style.cssText = 'padding:0.6rem 1.2rem; color:#10b981; border-color:#10b981;';
                            completedBtn.disabled = true;
                            const circleCheckIcon = document.createElement('i');
                            circleCheckIcon.className = 'fa-solid fa-circle-check';
                            completedBtn.appendChild(circleCheckIcon);
                            completedBtn.appendChild(document.createTextNode(' مكتمل ومغلق'));
                            actionDiv.appendChild(completedBtn);
                        } else {
                            const rejectedBtn = document.createElement('button');
                            rejectedBtn.className = 'btn btn-outline';
                            rejectedBtn.style.cssText = 'padding:0.6rem 1.2rem; color:gray; border-color:gray;';
                            rejectedBtn.disabled = true;
                            const banIcon = document.createElement('i');
                            banIcon.className = 'fa-solid fa-ban';
                            rejectedBtn.appendChild(banIcon);
                            rejectedBtn.appendChild(document.createTextNode(' تم الرفض'));
                            actionDiv.appendChild(rejectedBtn);
                        }

                        card.appendChild(actionDiv);
                        list.appendChild(card);
                    });
                }

            } catch (err) {
                const errDiv = document.createElement('p');
errDiv.style.textAlign = 'center';
errDiv.style.color = 'red';
errDiv.textContent = 'حدث خطأ أثناء جلب البيانات. يرجى التحديث.';
const container = document.getElementById('myBookingsList');
container.textContent = '';
container.appendChild(errDiv);
            }
        }

        async function updateMyBooking(btn, id, status) {
            const originalText = btn.textContent;
            btn.textContent = '';
            
            const spinner = document.createElement('i');
            spinner.className = 'fas fa-spinner fa-spin';
            btn.appendChild(spinner);
            btn.appendChild(document.createTextNode(' جاري...'));
            btn.disabled = true;

            try {
                await E7_DB.updateBookingStatus(id, status);
                // نجاح التحديث
                await loadPartnerDashboard(); 
            } catch (err) {
                alert("⚠️ لم نتمكن من تحديث الحالة على السيرفر. يرجى التأكد من اتصال الإنترنت أو المحاولة لاحقاً.");
                btn.textContent = '';
                const icon = document.createElement('i');
                if (status === 'approved') {
                    icon.className = 'fa-solid fa-check';
                    btn.appendChild(icon);
                    btn.appendChild(document.createTextNode(' قبول الحجز'));
                } else if (status === 'rejected') {
                    icon.className = 'fa-solid fa-xmark';
                    btn.appendChild(icon);
                    btn.appendChild(document.createTextNode(' رفض واعتذار'));
                } else if (status === 'completed') {
                    icon.className = 'fa-solid fa-circle-check';
                    btn.appendChild(icon);
                    btn.appendChild(document.createTextNode(' إتمام الحجز'));
                } else {
                    btn.textContent = originalText;
                }
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
