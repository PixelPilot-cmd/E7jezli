<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي | E7jezli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .profile-header { background: white; padding: 4rem 0; border-bottom: 1px solid var(--border); }
        .loyalty-card { 
            background: linear-gradient(135deg, var(--primary), #8b5cf6); 
            color: white; padding: 2.5rem; border-radius: 25px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 15px 35px rgba(90, 185, 241, 0.3);
            margin-top: -3rem;
        }
        .points-badge { background: rgba(255,255,255,0.2); padding: 0.5rem 1.5rem; border-radius: 100px; font-weight: 800; font-size: 1.5rem; }
        .dashboard-card { background: white; padding: 2rem; border-radius: 20px; border: 1px solid var(--border); }
    </style>
</head>
<body style="background: var(--bg-main);">
    <header class="header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo"><i class="fa-solid fa-calendar-check"></i> <span>E7jezli</span></a>
            <nav class="nav-menu" id="navMenu">
                <ul class="nav-links">
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="my-bookings.html">حجوزاتي</a></li>
                </ul>
            </nav>
            <button class="mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <div class="profile-header">
        <div class="container">
            <div style="display: flex; align-items: center; gap: 2rem;">
                <div style="width: 100px; height: 100px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--primary);">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h1 id="userName" style="font-size: 2rem; font-weight: 800;">مرحباً بك!</h1>
                    <p id="userEmail" style="color: var(--text-muted);"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: 2rem;">
        <div class="loyalty-card">
            <div>
                <h3 style="margin-bottom: 0.5rem;">رصيد نقاط الولاء</h3>
                <p style="opacity: 0.9;">استبدل نقاطك بخصومات حقيقية في حجوزاتك القادمة</p>
            </div>
            <div class="points-badge"><span id="userPoints">0</span> <i class="fa-solid fa-gem"></i></div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-top: 3rem;">
            <div class="dashboard-card">
                <h3 style="margin-bottom: 2rem;"><i class="fa-solid fa-clock-rotate-left"></i> آخر النشاطات</h3>
                <div id="activityLog">
                    <!-- سيتم التحميل هنا -->
                </div>
            </div>

            <div class="dashboard-card">
                <h3><i class="fa-solid fa-shield-halved"></i> الأمان</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin: 1rem 0;">حسابك محمي بنظام التحقق الثنائي</p>
                <button class="btn btn-outline" style="width: 100%; justify-content: center;">تغيير كلمة المرور</button>
                <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem; background: #fee2e2; color: #dc2626; border: none;" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const profile = JSON.parse(localStorage.getItem('user_profile'));
            if (!profile) {
                window.location.href = 'auth.html';
                return;
            }

            document.getElementById('userName').innerText = profile.name;
            document.getElementById('userEmail').innerText = profile.email;
            document.getElementById('userPoints').innerText = profile.points || 0;

            // تحميل حجوزات المستخدم كنشاطات
            const books = await E7_DB.getBookings();
            const log = document.getElementById('activityLog');
            if (books.length === 0) {
                log.innerHTML = '<p style="opacity: 0.5;">لا توجد حجوزات سابقة حالياً.</p>';
            } else {
                log.innerHTML = books.slice(0, 5).map(b => `
                    <div style="padding: 1rem 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
                        <div>
                            <strong>${b.businessName}</strong>
                            <p style="font-size: 0.8rem; color: var(--text-muted);">${b.service} - ${b.date}</p>
                        </div>
                        <span class="badge-status status-${b.status}">${b.status === 'pending' ? 'بانتظار التأكيد' : 'مؤكد'}</span>
                    </div>
                `).join('');
            }
        });

        function logout() {
            localStorage.removeItem('user_profile');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
